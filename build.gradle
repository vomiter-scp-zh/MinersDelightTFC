plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.120'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.resources.srcDir 'src/generated/resources'
repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.blamejared.com' }
}
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach { gameDirectory = file('run') }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
apply from: 'gradle/tfc-dep.gradle'
apply from: 'gradle/optional-dep.gradle'
apply from: 'gradle/publishing-local.gradle'
dependencies {
    implementation 'curse.maven:farmers-delight-398521:8672744'
    implementation 'curse.maven:miners-delight-plus-689630:8011049'
    implementation 'curse.maven:lodestone-616457:6565028'
}
tasks.named('processResources', ProcessResources) {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, mod_authors: mod_authors, mod_description: mod_description,
        minecraft_version_range: minecraft_version_range, loader_version_range: loader_version_range,
        neo_version_range: neo_version_range]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}
